- name: Start Streamlit App
  run: streamlit run app.py &
  timeout-minutes: 2

- name: Wait for app to be ready
  run: |
    for i in {1..30}; do
      if curl -s http://localhost:8501 > /dev/null; then
        echo "App is ready"
        break
      fi
      sleep 2
    done

- name: Run Tests
  run: python test_app.py